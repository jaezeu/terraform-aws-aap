name: Terraform Deployment

on:
  workflow_dispatch:

env:            
  AWS_REGION: ap-southeast-1  

jobs:
  CICD:
    runs-on: ubuntu-latest

    # Terraform reads TF_VAR_<name> as the input variable <name>
    env:
      TF_VAR_redhat_registry_username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
      TF_VAR_redhat_registry_password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}
      TF_VAR_redhat_offline_token: ${{ secrets.REDHAT_OFFLINE_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4

    - name: Terraform fmt
      run: terraform fmt --recursive
    
    - name: Terraform Init
      run: terraform init
    
    - name: Terraform Validate
      run: terraform validate 

    - name: Terraform Plan
      run: terraform plan
    
    - name: Terraform Apply
      run: terraform apply --auto-approve